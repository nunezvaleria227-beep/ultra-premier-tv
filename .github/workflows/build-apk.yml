name: Build APK

# Genera el APK final (release) en la nube; no hace falta Android Studio.
#  - Cada vez que se sube código a la rama main compila el proyecto y publica el APK en "Releases".
#  - También se puede lanzar a mano desde la pestaña Actions.
#  - La llave de firma se crea una sola vez y se conserva entre compilaciones, así cada versión
#    nueva se instala ENCIMA de la anterior sin desinstalar.
#  - El enlace estable al último APK es:
#    https://github.com/nunezvaleria227-beep/ultra-premier-tv/releases/latest/download/UltraPremierTV.apk
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Cada 3 días: solo "toca" la llave guardada para que GitHub no la borre por falta de uso.
    - cron: "17 6 */3 * *"

permissions:
  contents: write

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/signing
          key: ultrapremier-signing-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar la llave de firma
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/signing
          key: ultrapremier-signing-v1

      - name: Preparar la llave de firma
        run: |
          DIR="$RUNNER_TEMP/signing"
          mkdir -p "$DIR"
          if [ ! -s "$DIR/release.jks" ] || [ ! -s "$DIR/pass.txt" ]; then
            rm -f "$DIR/release.jks" "$DIR/pass.txt"
            printf '%s' "$(openssl rand -hex 16)" > "$DIR/pass.txt"
            PASS="$(cat "$DIR/pass.txt")"
            keytool -genkeypair -noprompt \
              -keystore "$DIR/release.jks" -storetype PKCS12 \
              -alias ultrapremier -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Ultra Premier TV, O=Ultra Premier TV, C=MX"
            echo "::notice::Llave de firma NUEVA (primera vez o se borró la anterior): esta versión sí exige desinstalar la anterior."
          else
            echo "::notice::Llave de firma restaurada: esta versión se instala encima de la anterior."
          fi
          PASS="$(cat "$DIR/pass.txt")"
          echo "::add-mask::$PASS"
          {
            echo "KEYSTORE_PATH=$DIR/release.jks"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=ultrapremier"
            echo "KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Compilar APK release
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee build.log || {
            echo "---- ERRORES DE COMPILACION ----"
            # Se publican como anotaciones para poder leerlos sin descargar el log completo.
            grep -E "^e: |error: |What went wrong" -A2 build.log | grep -v '^--$' | head -80 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk UltraPremierTV.apk

      - name: Verificar firma y que no sea de depuración
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=UltraPremierTV.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee sign.log
          if grep -qi "Android Debug" sign.log; then
            echo "::error::El APK está firmado con la llave de depuración"
            exit 1
          fi
          "$BT/aapt" dump badging "$APK" > badging.log
          if grep -q "application-debuggable" badging.log; then
            echo "::error::El APK es depurable"
            exit 1
          fi
          # Resumen legible como anotaciones
          echo "::notice::$(grep -m1 '^package:' badging.log)"
          echo "::notice::$(grep -m1 '^application-label:' badging.log)"
          echo "::notice::$(grep -m1 'leanback-launchable-activity' badging.log | cut -c1-120)"
          echo "::notice::$(grep -m1 'Signer #1 certificate DN' sign.log)"
          echo "::notice::$(grep -m1 'Signer #1 certificate SHA-256' sign.log)"
          echo "::notice::$(grep -m1 'Verified using v2' sign.log)"
          echo "::notice::depurable=no"

      - uses: actions/upload-artifact@v4
        with:
          name: UltraPremierTV-apk
          path: UltraPremierTV.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ultra Premier TV 1.0.${{ github.run_number }}
          files: UltraPremierTV.apk
