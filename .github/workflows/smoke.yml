name: Prueba de humo

# Compila la app en modo depuración, la abre en un Android virtual con un servidor de mentira
# (canales, películas, series, guía y subtítulos) y recorre las pantallas. Deja capturas e informe
# en la rama "smoke-results". No publica nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Video e imágenes de prueba
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          bash tools/smoke/make_media.sh "$RUNNER_TEMP/media"

      - name: Apuntar la app al servidor de prueba
        run: |
          sed -i 's#http://gazytv.vip:8880#http://10.0.2.2:8880#' app/src/main/java/com/example/mitvplayer/Config.kt
          sed -i 's#https://api.opensubtitles.com/api/v1#http://10.0.2.2:8880/os/api/v1#' app/src/main/java/com/example/mitvplayer/data/SubtitleService.kt
          grep -n "10.0.2.2" app/src/main/java/com/example/mitvplayer/Config.kt app/src/main/java/com/example/mitvplayer/data/SubtitleService.kt

      - name: Compilar (depuración)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee build.log || {
            echo "---- ERRORES DE COMPILACION ----"
            grep -E "^e: |error: |What went wrong" -A2 build.log | grep -v '^--$' | head -80 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }
          ls -la app/build/outputs/apk/debug/

      - name: Servidor de prueba
        run: |
          nohup python3 tools/smoke/mock_xtream.py --media "$RUNNER_TEMP/media" > mock.log 2>&1 &
          sleep 2
          curl -s "http://127.0.0.1:8880/player_api.php?username=demo&password=demo" | head -c 300

      - name: Android virtual y recorrido
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/smoke/run.sh

      - name: Registro del servidor
        if: always()
        run: |
          mkdir -p smoke-out
          curl -s http://127.0.0.1:8880/__log > smoke-out/servidor-peticiones.txt || true
          cp mock.log smoke-out/servidor-consola.txt || true

      - name: Publicar resultados (rama smoke-results)
        if: always()
        run: |
          cd smoke-out
          for f in *.png; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf scale=960:-1 -q:v 4 "${f%.png}.jpg" && rm "$f"
          done
          git init -q
          git checkout -q -b smoke-results
          git add -A
          git -c user.name="smoke" -c user.email="smoke@example.com" commit -q -m "Resultados de la prueba de humo ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke-results
